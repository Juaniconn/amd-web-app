services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amd
      POSTGRES_PASSWORD: amd
      POSTGRES_DB: amd_operations
    ports:
      - "5432:5432"
    volumes:
      - amd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amd -d amd_operations"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amd_pgdata:
