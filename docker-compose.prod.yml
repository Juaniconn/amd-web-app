# PostgreSQL para producción en el VPS de Oracle Cloud (ARM aarch64).
#
# La imagen postgres:16-alpine es multi-arquitectura, así que funciona igual
# en la instancia A1.Flex (ARM) que en local x86.
#
# Uso en el VPS:
#   docker compose -f docker-compose.prod.yml up -d
#
# La contraseña se lee de .env.production (NO se escribe aquí).

services:
  postgres:
    image: postgres:16-alpine
    container_name: amd_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
      POSTGRES_DB: ${POSTGRES_DB:-amd_operations}
      # Locale es_MX para ordenamientos y mensajes coherentes con el ERP
      LANG: es_MX.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Solo localhost: la base NO se expone a internet. La app corre en el
      # mismo host y se conecta por 127.0.0.1.
      - "127.0.0.1:5432:5432"
    volumes:
      - amd_pgdata:/var/lib/postgresql/data
      # Respaldos: el script scripts/deploy/backup.sh escribe aquí
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amd} -d ${POSTGRES_DB:-amd_operations}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Con 24 GB de RAM en la A1.Flex, dejamos 2 GB para Postgres.
    # Ajusta si la planta crece mucho.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      # Log de consultas lentas (>1s) para diagnosticar
      - "-c"
      - "log_min_duration_statement=1000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  amd_pgdata:
    name: amd_pgdata
